<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>상하이 여행 후보 고르기</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f6f4f1;
      --card: #ffffff;
      --ink: #1d1b19;
      --sub: #6f6a64;
      --line: #e6e1da;
      --accent: #c8102e;
      --must: #e0245e;
      --ok: #f2a900;
      --pass: #8a8f98;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(246, 244, 241, .92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .top {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 16px 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top h1 {
      font-size: 18px;
      margin: 0;
      flex: 1;
      letter-spacing: -0.02em;
    }

    .top h1 small {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--sub);
      margin-top: 2px;
    }

    .me-chip {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .me-chip b {
      color: var(--accent);
    }

    .tabs {
      max-width: 960px;
      margin: 0 auto;
      padding: 4px 12px 10px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 14px;
      cursor: pointer;
    }

    .tab.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .tab.manage {
      color: var(--sub);
      border-style: dashed;
    }

    .tab.result {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tab.result.active {
      background: var(--accent);
      color: #fff;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 16px 80px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--sub);
    }

    .toolbar label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .progress {
      font-weight: 600;
      color: var(--ink);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .thumb {
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 40px;
    }

    .thumb .cats {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: flex-end;
      max-width: 70%;
    }

    .thumb .cat {
      font-size: 12px;
      font-weight: 600;
      color: rgba(0, 0, 0, .6);
      background: rgba(255, 255, 255, .75);
      padding: 4px 9px;
      border-radius: 999px;
    }

    .body {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .name .zh {
      font-weight: 500;
      color: var(--sub);
      font-size: 13px;
      margin-left: 4px;
    }

    .meta {
      font-size: 12px;
      color: var(--sub);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meta a {
      color: var(--sub);
    }

    .desc {
      font-size: 14px;
      line-height: 1.5;
      color: #3b3834;
      flex: 1;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 4px;
    }

    .choice {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 8px 4px;
      font-size: 13px;
      cursor: pointer;
      color: var(--ink);
      transition: transform .08s;
    }

    .choice:active {
      transform: scale(.96);
    }

    .choice.on[data-v="must"] {
      background: var(--must);
      border-color: var(--must);
      color: #fff;
    }

    .choice.on[data-v="ok"] {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }

    .choice.on[data-v="pass"] {
      background: var(--pass);
      border-color: var(--pass);
      color: #fff;
    }

    .other {
      font-size: 12px;
      color: var(--sub);
      padding-top: 2px;
    }

    .other b {
      color: var(--ink);
    }

    .section {
      margin-bottom: 22px;
    }

    .section h2 {
      font-size: 15px;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section h2 .n {
      font-size: 12px;
      color: var(--sub);
      font-weight: 500;
    }

    .section .hint {
      font-size: 12px;
      color: var(--sub);
      margin: -4px 0 8px;
    }

    .rows {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }

    .row:first-child {
      border-top: 0;
    }

    .row .e {
      font-size: 20px;
    }

    .row .t {
      flex: 1;
    }

    .row .t small {
      display: block;
      color: var(--sub);
      font-size: 12px;
    }

    .row .who {
      font-size: 12px;
      color: var(--sub);
      text-align: right;
      white-space: nowrap;
    }

    .empty {
      padding: 14px;
      color: var(--sub);
      font-size: 13px;
    }

    .btn {
      border: 0;
      background: var(--ink);
      color: #fff;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .banner {
      font-size: 12px;
      background: #fff4d6;
      border: 1px solid #f0dc9c;
      color: #6b5300;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    .modal h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .modal p {
      margin: 0 0 16px;
      color: var(--sub);
      font-size: 14px;
    }

    .modal .who-btns {
      display: grid;
      gap: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      transition: .2s;
      pointer-events: none;
      z-index: 60;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #bbb;
      display: inline-block;
      margin-right: 4px;
      vertical-align: middle;
    }

    .live.on {
      background: #2bb673;
    }

    .live.err {
      background: var(--must);
    }

    .live.loading {
      width: 10px;
      height: 10px;
      background: none;
      border: 2px solid #d9d3cb;
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* 로딩 스켈레톤 */
    .loading-msg {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 12px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #d9d3cb;
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
      flex: none;
    }

    .sk {
      background: linear-gradient(90deg, #ece7e0 25%, #f5f1ec 50%, #ece7e0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      from {
        background-position: 200% 0;
      }

      to {
        background-position: -200% 0;
      }
    }

    .sk-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .sk-card .sk-thumb {
      height: 84px;
      border-radius: 0;
    }

    .sk-card .sk-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 연결 실패 화면 */
    .errbox {
      background: var(--card);
      border: 1px solid #f3c2cf;
      border-radius: var(--radius);
      padding: 20px;
    }

    .errbox h2 {
      font-size: 17px;
      margin: 0 0 6px;
      color: #8a1230;
    }

    .errbox p {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--sub);
    }

    .errbox ol {
      margin: 0 0 16px;
      padding-left: 20px;
      font-size: 14px;
      line-height: 1.6;
    }

    .errbox li {
      margin-bottom: 8px;
    }

    .errbox code {
      background: #f4f0ea;
      padding: 1px 5px;
      border-radius: 5px;
      font-size: 12px;
      word-break: break-all;
    }

    /* 후보 추가 */
    .fab {
      position: fixed;
      right: 18px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 20;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(200, 16, 46, .35);
    }

    .added {
      font-size: 12px;
      color: var(--sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed var(--line);
      padding-top: 8px;
      margin-top: 2px;
    }

    .del {
      border: 0;
      background: none;
      color: var(--sub);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }

    .modal.form {
      max-width: 420px;
      text-align: left;
      max-height: 90vh;
      overflow-y: auto;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 600;
    }

    .field .opt {
      color: var(--sub);
      font-weight: 400;
    }

    .field input,
    .field select,
    .field textarea {
      font: inherit;
      font-weight: 400;
      font-size: 15px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
    }

    .field textarea {
      resize: vertical;
      min-height: 64px;
    }

    .row2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-width: 0;
    }

    .toast {
      bottom: calc(86px + env(safe-area-inset-bottom));
    }

    .form-btns {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8px;
      margin-top: 4px;
    }

    .btn.ghost {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn:disabled {
      opacity: .5;
    }

    .btn.small {
      width: auto;
      padding: 10px 14px;
      flex: none;
    }

    /* 카테고리 선택 (폼) */
    .cat-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .fcat {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      color: var(--ink);
    }

    .fcat.on {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .fcat.on::before {
      content: "✓ ";
    }

    .cat-new {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .cat-new input {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 15px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .filter-note {
      font-size: 12px;
      color: var(--sub);
      margin: -4px 0 10px;
    }

    .filter-note button {
      margin-left: 4px;
    }

    /* 사진 */
    .thumb.has-photo {
      height: 170px;
      background-size: cover;
      background-position: center;
      align-items: flex-start;
      justify-content: flex-end;
      padding-top: 12px;
    }

    .linkbtn {
      border: 0;
      background: none;
      color: var(--sub);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }

    .row .ph {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background-size: cover;
      background-position: center;
      flex: none;
    }

    .photo-pick {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .photo-preview {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      background: #f0ece6 center/cover;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .photo-pick input[type=file] {
      font-size: 13px;
      padding: 6px;
    }

    .photo-ctl {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .btn.danger {
      background: #fff;
      color: var(--must);
      border: 1px solid #f3c2cf;
      margin-top: 10px;
    }

    .banner.err {
      background: #fde8ec;
      border-color: #f3c2cf;
      color: #8a1230;
    }
  </style>
</head>

<body>

  <header>
    <div class="top">
      <h1>🇨🇳 상하이 어디 갈까?<small id="status"><span class="live loading" id="liveDot"></span><span id="statusText">연결
            중…</span></small></h1>
      <button class="me-chip" id="meChip">나: <b id="meName">-</b> ⇄</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <main id="main"></main>

  <div class="modal-bg" id="whoModal">
    <div class="modal">
      <h3>누구세요? 👋</h3>
      <p>선택한 이름으로 체크가 저장돼요.<br />나중에 위쪽 버튼으로 바꿀 수 있어요.</p>
      <div class="who-btns" id="whoBtns"></div>
    </div>
  </div>

  <button class="fab" id="addOpen">＋ 후보 추가</button>

  <div class="modal-bg" id="addModal">
    <form class="modal form" id="addForm" autocomplete="off">
      <h3 id="formTitle">새 후보 추가 ✍️</h3>
      <p id="formDesc">추가한 후보는 두 사람 모두에게 보여요.</p>
      <div class="field">카테고리 <span class="opt">(1개 이상 · 여러 개 고를 수 있어요)</span>
        <div class="cat-picker" id="catPicker"></div>
        <div class="cat-new">
          <input id="catNewInput" maxlength="20" placeholder="새 카테고리 직접 입력 (예: 야시장)" />
          <button type="button" class="btn ghost small" id="catNewAdd">추가</button>
        </div>
      </div>
      <label class="field">이름
        <input name="name" required maxlength="40" placeholder="예: 쟈쟈탕바오" />
      </label>
      <label class="field">중국어 이름 <span class="opt">(선택 · 지도 검색에 써요)</span>
        <input name="zh" maxlength="40" placeholder="예: 佳家汤包" />
      </label>
      <div class="row2">
        <label class="field">지역 <span class="opt">(선택)</span>
          <input name="area" maxlength="20" placeholder="예: 황푸" />
        </label>
        <label class="field">소요 시간 <span class="opt">(선택)</span>
          <input name="duration" maxlength="20" placeholder="예: 1시간" />
        </label>
      </div>
      <label class="field">한 줄 설명 <span class="opt">(선택)</span>
        <textarea name="description" maxlength="200" placeholder="왜 가고 싶은지 적어 주세요"></textarea>
      </label>
      <div class="field">사진 <span class="opt">(선택)</span>
        <div class="photo-pick">
          <div class="photo-preview" id="addPreview">📷</div>
          <div class="photo-ctl">
            <input type="file" name="photo" id="addPhoto" accept="image/*" />
            <button type="button" class="linkbtn" id="photoRemove" hidden>현재 사진 삭제</button>
          </div>
        </div>
      </div>
      <label class="field">이모지 <span class="opt">(선택 · 사진이 없을 때 보여요)</span>
        <input name="emoji" maxlength="4" placeholder="예: 🍜" />
      </label>
      <div class="form-btns">
        <button type="button" class="btn ghost" id="addCancel">취소</button>
        <button type="submit" class="btn" id="addSubmit">추가하기</button>
      </div>
      <button type="button" class="btn danger" id="formDelete" hidden>🗑 이 후보 삭제</button>
    </form>
  </div>

  <div class="modal-bg" id="catModal">
    <div class="modal form">
      <h3>카테고리 관리 🗂</h3>
      <p>카테고리를 지워도 후보는 지워지지 않아요. 그 카테고리만 후보에서 빠져요.</p>
      <div class="cat-new" style="margin:0 0 12px">
        <input id="catMgrInput" maxlength="20" placeholder="새 카테고리 이름" />
        <button type="button" class="btn small" id="catMgrAdd">추가</button>
      </div>
      <div class="rows" id="catMgrList"></div>
      <button type="button" class="btn ghost" id="catMgrClose" style="margin-top:12px">닫기</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* =========================================================
     * 1) 설정: Supabase 정보와 두 사람 이름을 입력하세요
     *    (값을 비워 두면 '로컬 모드'로 동작해요 — 이 기기에만 저장)
     * ========================================================= */
    const CONFIG = {
      SUPABASE_URL: "https://mnxupkymxhubfahiditk.supabase.co",
      SUPABASE_KEY: "sb_publishable_RWgM9cUhuWATL2corxgsEw_KRthhlq5",     // anon public 키 또는 Publishable 키
      PEOPLE: ["승은", "연경"],                       // 두 사람 이름 (예: ["지민", "수아"])
    };

    /* =========================================================
     * 2) 카테고리 + 처음 넣어 둘 기본 후보
     *    후보는 화면에서 추가·수정·삭제해요. (DB의 places 테이블에 저장)
     *    아래 SEED_PLACES는 로컬 모드의 초기값이고,

    function catColor(name) {

    let categoryRows = [];

    function placeCats(r) {
      if (Array.isArray(r.categories) && r.categories.length) return r.categories;

      return [];

    function allCategories() {
      const names = [...categoryRows]
        .sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0))
        .map(c => c.name);
      placeRows.forEach(r => placeCats(r).forEach(n => {if (!names.includes(n)) names.push(n);}));
      return names;
    }

    let placeRows = [];

      return SEED_PLACES.map((p, i) => ({
        id: p.id, categories: [LEGACY_CAT[p.cat] || p.cat], name: p.name, zh: p.zh || null, area: p.area || null,

        added_by: SEED_AUTHOR, created_at: new Date(Date.UTC(2026, 0, 1, 0, 0, i)).toISOString(),
      }));
    }
    function rowToPlace(r) {
      return {
        id: r.id, cats: placeCats(r),
        e: r.emoji || "📍",
        name: r.name, zh: r.zh || "", area: r.area || "미정", time: r.duration || "미정",
        desc: r.description || "", addedBy: r.added_by,
        custom: !!r.added_by && r.added_by !== SEED_AUTHOR,
      };
    }
    function allPlaces() {
      return [...placeRows]
        .sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0))
        .map(rowToPlace);
    }
    function findRow(id) {return placeRows.find(r => r.id === id);}
    function upsertRow(row) {
      const i = placeRows.findIndex(r => r.id === row.id);
      if (i >= 0) placeRows[i] = {...placeRows[i], ...row}; else placeRows.push(row);
    }
    function removeRow(id) {
      placeRows = placeRows.filter(r => r.id !== id);

    // Supabase 오류를 이해하기 쉬운 문장으로
    function errMsg(error, what) {

        return `${what}: 권한이 없어요. supabase-setup.sql을 다시 실행해 주세요`;

      if (/Failed to fetch|NetworkError/i.test(m))
        return `${what}: 인터넷 연결을 확인해 주세요`;
      return `${what}: ${error?.message || "알 수 없는 오류"}`;
    }

      const rand = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
      return "c_" + rand.replace(/-/g, "").slice(0, 12);
    }

    const state = {

    function safeGet(k) {try {return localStorage.getItem(k);} catch {return null;} }
    function safeSet(k, v) {try {localStorage.setItem(k, v);} catch { } }

    function applyRow(row) {
      if (!state.picks[row.person]) state.picks[row.person] = {};
      if (row.choice) state.picks[row.person][row.place_id] = row.choice;
      else delete state.picks[row.person][row.place_id];
    }

    // Supabase 주소 정리: 공백·끝 슬래시·/rest/v1 같은 경로가 붙어 있어도 프로젝트 주소만 남겨요
    const SB_URL = (CONFIG.SUPABASE_URL || "").trim().replace(/\/+$/, "").replace(/\/(rest|auth|storage|realtime)\/v1.*$/i, "");
    const SB_KEY = (CONFIG.SUPABASE_KEY || "").trim();

    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject({code: "TIMEOUT", message: "응답 시간 초과"}), ms)),
      ]);
    }

    // 연결 실패 원인 진단 → { title, detail, hints[] }
    async function diagnose(error) {
      const m = `${error?.code || ""} ${error?.message || ""}`;
      const urlHint = `index.html의 <b>SUPABASE_URL</b>이 Supabase 대시보드 <b>Project Settings → API</b>의 <b>Project URL</b>과 똑같은지 확인해 주세요. 지금 값: <code>${esc(SB_URL || "(비어 있음)")}</code>`;

      if (!/^https:\/\/[^\s/]+$/.test(SB_URL))
        return {title: "Supabase 주소 형식이 맞지 않아요", hints: [urlHint, "주소는 <code>https://프로젝트ID.supabase.co</code> 형태여야 해요."]};
      if (/42501|permission denied|row-level security/i.test(m))
        return {title: "데이터에 접근할 권한이 없어요", hints: ["최신 <b>supabase-setup.sql</b> 전체를 SQL Editor에서 다시 실행해 주세요."]};
      if (/42P01|PGRST205|does not exist|Could not find the table/i.test(m))
        return {title: "테이블이 아직 없어요", hints: ["<b>supabase-setup.sql</b> 전체를 SQL Editor에서 실행해 주세요."]};
      if (/Invalid API key|No API key|PGRST30|JWT|401/i.test(m))
        return {title: "API 키가 맞지 않아요", hints: ["index.html의 <b>SUPABASE_KEY</b>에 <b>anon public</b> 키 또는 <b>Publishable</b> 키를 넣어 주세요. 앞뒤 공백이나 줄바꿈이 섞이지 않았는지도 확인해 주세요."]};

      // 네트워크 계열(Failed to fetch, 시간 초과): 서버 주소 자체에 닿는지 한 번 더 확인
      if (/TIMEOUT|Failed to fetch|NetworkError|Load failed|fetch/i.test(m)) {
        let reachable = false;
        try {await withTimeout(fetch(`${SB_URL}/auth/v1/health`, {headers: {apikey: SB_KEY}}), 6000); reachable = true;} catch { }
        if (!reachable) {
          return {
            title: "Supabase 서버에 접속하지 못했어요",
            detail: "브라우저가 서버 주소에 아예 닿지 못했어요. 아래 순서대로 확인해 주세요.",
            hints: [
              urlHint,
              "Supabase 대시보드에서 프로젝트가 <b>Paused(일시정지)</b> 상태인지 확인해 주세요. 그렇다면 <b>Restore</b>를 누르고 1~2분 뒤 다시 시도해 주세요.",
              "회사·공용 와이파이나 VPN, 보안 프로그램이 <code>supabase.co</code>를 막을 수 있어요. <b>휴대폰 데이터</b>로 열어 보세요.",
            ],
          };
        }
        return {
          title: "서버에는 닿지만 데이터 요청이 막혔어요",
          detail: "서버 주소는 정상이에요. 브라우저 쪽에서 요청이 차단된 것 같아요.",
          hints: [
            "광고 차단 확장 프로그램(AdBlock, uBlock 등)을 이 페이지에서 꺼 보세요.",
            "시크릿 창이나 다른 브라우저로 열어 보세요.",
          ],
        };
      }
      return {title: "불러오지 못했어요", detail: error?.message || "", hints: ["잠시 후 다시 시도해 주세요. 계속되면 브라우저 Console의 오류 내용을 확인해 주세요."]};
    }

    function loadLocal() {
      try {Object.assign(state.picks, JSON.parse(safeGet(LS_LOCAL) || "{}"));} catch { }
      try {placeRows = JSON.parse(safeGet(LS_LOCAL_PLACES) || "[]");} catch { }
      if (!safeGet(LS_LOCAL_SEEDED)) {                      // 처음 한 번만 기본 후보를 채워 넣어요
        seedRows().forEach(r => {if (!findRow(r.id)) placeRows.push(r);});
        saveLocalPlaces(); safeSet(LS_LOCAL_SEEDED, "1");
      }
      try {categoryRows = JSON.parse(safeGet(LS_LOCAL_CATS) || "null");} catch {categoryRows = null;}
      if (!Array.isArray(categoryRows)) {categoryRows = seedCategoryRows(); saveLocalCats();}
      try {photos = JSON.parse(safeGet(LS_LOCAL_PHOTOS) || "{}");} catch { }
      CONFIG.PEOPLE.forEach(p => state.picks[p] = state.picks[p] || {});
      setStatus("off", "로컬 모드 · 이 기기에만 저장돼요");
    }

    let channelStarted = false;
    function startRealtime() {
      if (channelStarted) return;
      channelStarted = true;
      setStatus("loading", "실시간 연결 중…");
      sb.channel("picks-live")
        .on("postgres_changes", {event: "*", schema: "public", table: "picks"}, payload => {
          if (payload.eventType === "DELETE") {
            const o = payload.old || {};
            if (o.person && o.place_id) applyRow({person: o.person, place_id: o.place_id, choice: null});
          } else {
            applyRow(payload.new);
          }
          render();
        })
        .on("postgres_changes", {event: "*", schema: "public", table: "places"}, payload => {
          if (payload.eventType === "DELETE") {if (payload.old?.id) removeRow(payload.old.id);}
          else upsertRow(payload.new);
          render();
        })
        .on("postgres_changes", {event: "*", schema: "public", table: "categories"}, payload => {
          if (payload.eventType === "DELETE") {
            if (payload.old?.name) categoryRows = categoryRows.filter(c => c.name !== payload.old.name);
          } else if (!categoryRows.some(c => c.name === payload.new.name)) {
            categoryRows.push(payload.new);
          }
          render();
        })
        .on("postgres_changes", {event: "*", schema: "public", table: "place_photos"}, payload => {
          if (payload.eventType === "DELETE") {if (payload.old?.place_id) delete photos[payload.old.place_id];}
          else photos[payload.new.place_id] = {url: payload.new.url, path: payload.new.path};
          render();
        })
        .subscribe(status => {
          if (status === "SUBSCRIBED") setStatus("on", "실시간 동기화 중");
          else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") setStatus("off", "실시간 연결 끊김 · 저장은 돼요 (새로고침하면 최신으로 보여요)");
          else if (status === "CLOSED") setStatus("off", "실시간 연결 종료");
        });
    }

    async function loadAll() {
      if (isLocal) {loadLocal(); return;}

      state.loading = true; loadError = null;
      setStatus("loading", "서버에 연결 중…");
      render();

      try {
        if (!/^https:\/\/[^\s/]+$/.test(SB_URL)) throw {code: "BAD_URL", message: "invalid url"};
        if (!sb) sb = window.supabase.createClient(SB_URL, SB_KEY);
        const [picksRes, placesRes, photosRes, catsRes] = await withTimeout(Promise.all([
          sb.from("picks").select("person, place_id, choice"),
          sb.from("places").select("*").order("created_at"),
          sb.from("place_photos").select("place_id, url, path"),
          sb.from("categories").select("name, created_at").order("created_at"),
        ]), 12000);
        const firstErr = placesRes.error || picksRes.error || catsRes.error;
        if (firstErr) throw firstErr;

        placeRows = placesRes.data;
        categoryRows = catsRes.data;
        CONFIG.PEOPLE.forEach(p => state.picks[p] = {});
        picksRes.data.forEach(applyRow);
        photos = {};
        if (photosRes.error) console.error(photosRes.error);
        else photosRes.data.forEach(r => photos[r.place_id] = {url: r.url, path: r.path});

        state.loading = false;
        render();
        startRealtime();
      } catch (err) {
        console.error("[불러오기 실패]", err);
        setStatus("err", "연결 실패 · 원인 확인 중…");
        loadError = await diagnose(err);
        state.loading = false;
        setStatus("err", "연결 실패");
        render();
      }
    }

    async function setPick(placeId, choice) {
      const person = state.me;
      const prev = state.picks[person][placeId] || null;
      const next = prev === choice ? null : choice;      // 같은 버튼 다시 누르면 해제
      applyRow({person, place_id: placeId, choice: next});
      render();

      if (isLocal) {safeSet(LS_LOCAL, JSON.stringify(state.picks)); return;}

      let res;
      if (next === null) {
        res = await sb.from("picks").delete().match({person, place_id: placeId});
      } else {
        res = await sb.from("picks").upsert(
          {person, place_id: placeId, choice: next, updated_at: new Date().toISOString()},
          {onConflict: "person,place_id"}
        );
      }
      if (res.error) {
        console.error(res.error);
        applyRow({person, place_id: placeId, choice: prev});
        render();
        toast(errMsg(res.error, "저장 실패"));
      }
    }

    /* ---------- 카테고리 CRUD ---------- */
    async function ensureCategories(names) {
      const missing = [...new Set(names)].filter(n => !categoryRows.some(c => c.name === n));
      if (!missing.length) return true;
      const now = Date.now();
      const rows = missing.map((name, i) => ({name, created_at: new Date(now + i).toISOString()}));
      categoryRows.push(...rows);
      if (isLocal) {saveLocalCats(); return true;}
      const {error} = await sb.from("categories").upsert(rows, {onConflict: "name", ignoreDuplicates: true});
      if (error) {
        console.error(error);
        categoryRows = categoryRows.filter(c => !missing.includes(c.name));
        toast(errMsg(error, "카테고리 저장 실패"));
        return false;
      }
      return true;
    }

    async function deleteCategory(name) {
      // 1) 이 카테고리가 붙은 후보에서 빼고
      const affected = placeRows.filter(r => placeCats(r).includes(name));
      for (const r of affected) {
        const ok = await updatePlace(r.id, {
          categories: placeCats(r).filter(n => n !== name),
          updated_at: new Date().toISOString(),
        });
        if (!ok) return false;
      }
      // 2) 카테고리 목록에서 지워요
      const backup = categoryRows;
      categoryRows = categoryRows.filter(c => c.name !== name);
      state.selected = state.selected.filter(n => n !== name);
      render();
      if (isLocal) {saveLocalCats(); return true;}
      const {error} = await sb.from("categories").delete().eq("name", name);
      if (error) {
        console.error(error);
        categoryRows = backup; render();
        toast(errMsg(error, "카테고리 삭제 실패"));
        return false;
      }
      return true;
    }

    /* ---------- 후보 CRUD ---------- */
    async function createPlace(row) {
      upsertRow(row);
      render();
      if (isLocal) {saveLocalPlaces(); return true;}
      const {error} = await sb.from("places").insert(row);
      if (error) {
        console.error(error);
        removeRow(row.id); render();
        toast(errMsg(error, "추가 실패"));
        return false;
      }
      return true;
    }

    async function updatePlace(id, fields) {
      const before = {...findRow(id)};
      upsertRow({id, ...fields});
      render();
      if (isLocal) {saveLocalPlaces(); return true;}
      const {data, error} = await sb.from("places").update(fields).eq("id", id).select("id");
      if (error || !data?.length) {
        console.error(error);
        upsertRow(before); render();
        toast(error ? errMsg(error, "수정 실패") : "수정 실패: 이미 삭제된 후보예요");
        return false;
      }
      return true;
    }

    async function deletePlace(id) {
      const row = findRow(id);
      if (!row) return false;
      if (photos[id]) await removePhoto(id, true);
      const backupPicks = CONFIG.PEOPLE.map(p => [p, state.picks[p][id]]);
      removeRow(id);
      render();
      if (isLocal) {
        saveLocalPlaces();
        safeSet(LS_LOCAL, JSON.stringify(state.picks));
        toast("삭제했어요");
        return true;
      }
      const r1 = await sb.from("picks").delete().eq("place_id", id);
      const r2 = await sb.from("places").delete().eq("id", id);
      if (r1.error || r2.error) {
        console.error(r1.error || r2.error);
        upsertRow(row);
        backupPicks.forEach(([p, c]) => c && applyRow({person: p, place_id: id, choice: c}));
        render();
        toast(errMsg(r1.error || r2.error, "삭제 실패"));
        return false;
      }
      toast("삭제했어요");
      return true;
    }

    /* ---------- 사진 ---------- */
    // 사진을 긴 변 기준으로 줄이고 JPEG로 압축 (용량 절약)
    async function compressImage(file, maxSide, quality) {
      const url = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = () => reject(new Error("이미지를 읽을 수 없어요"));
          i.src = url;
        });
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        return await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
      } finally {
        URL.revokeObjectURL(url);
      }
    }
    function blobToDataURL(blob) {
      return new Promise(res => {const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob);});
    }

    async function setPhoto(placeId, file) {
      toast("사진 올리는 중…");
      let blob;
      try {blob = await compressImage(file, isLocal ? 800 : 1280, isLocal ? 0.7 : 0.8);}
      catch {toast("이 사진 형식은 열 수 없어요. JPG나 PNG로 시도해 주세요"); return false;}

      if (isLocal) {
        photos[placeId] = {url: await blobToDataURL(blob), path: null};
        try {localStorage.setItem(LS_LOCAL_PHOTOS, JSON.stringify(photos));}
        catch {delete photos[placeId]; toast("로컬 저장 공간이 부족해요"); render(); return false;}
        render(); toast("사진을 넣었어요"); return true;
      }

      const old = photos[placeId];
      const path = `${placeId}/${Date.now()}.jpg`;
      const up = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, {contentType: "image/jpeg"});
      if (up.error) {console.error(up.error); toast(errMsg(up.error, "사진 업로드 실패")); return false;}
      const url = sb.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
      const {error} = await sb.from("place_photos").upsert(
        {place_id: placeId, url, path, added_by: state.me, updated_at: new Date().toISOString()},
        {onConflict: "place_id"}
      );
      if (error) {
        console.error(error);
        sb.storage.from(PHOTO_BUCKET).remove([path]);
        toast(errMsg(error, "사진 저장 실패")); return false;
      }
      photos[placeId] = {url, path};
      if (old?.path) sb.storage.from(PHOTO_BUCKET).remove([old.path]);   // 예전 사진 정리
      render(); toast("사진을 넣었어요");
      return true;
    }

    async function removePhoto(placeId, silent) {
      const old = photos[placeId];
      if (!old) return;
      delete photos[placeId];
      render();
      if (isLocal) {safeSet(LS_LOCAL_PHOTOS, JSON.stringify(photos)); if (!silent) toast("사진을 지웠어요"); return;}
      const {error} = await sb.from("place_photos").delete().eq("place_id", placeId);
      if (error) {console.error(error); photos[placeId] = old; render(); toast(errMsg(error, "사진 삭제 실패")); return;}
      if (old.path) sb.storage.from(PHOTO_BUCKET).remove([old.path]);
      if (!silent) toast("사진을 지웠어요");
    }

    /* ---------- UI helpers ---------- */
    function esc(s) {return String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));}
    function other() {return CONFIG.PEOPLE.find(p => p !== state.me);}
    // mode: "loading" | "on" | "off" | "err"
    function setStatus(mode, text) {
      const dot = document.getElementById("liveDot");
      dot.className = "live" + (mode === "off" ? "" : " " + mode);
      document.getElementById("statusText").textContent = text;
    }
    let toastTimer;
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
    }

    function tabCategories() {
      const list = allCategories();
      if (placeRows.some(r => !placeCats(r).length)) list.push(UNCATEGORIZED);
      return list;
    }

    function renderTabs() {
      const cats = tabCategories();
      state.selected = state.selected.filter(n => cats.includes(n));     // 지워진 카테고리는 선택 해제
      const inList = state.view === "list";
      document.getElementById("tabs").innerHTML =
        `<button class="tab ${inList && !state.selected.length ? "active" : ""}" data-all="1">전체</button>` +
        cats.map(n => `<button class="tab ${inList && state.selected.includes(n) ? "active" : ""}" data-cat="${esc(n)}">${esc(n)}</button>`).join("") +
        `<button class="tab manage" data-manage="1">⚙️ 카테고리</button>` +
        `<button class="tab result ${state.view === "result" ? "active" : ""}" data-view="result">🤝 결과 보기</button>`;
    }

    function matchesFilter(p) {
      if (!state.selected.length) return true;
      if (!p.cats.length) return state.selected.includes(UNCATEGORIZED);
      return p.cats.some(c => state.selected.includes(c));
    }

    function cardHTML(p) {
      const mine = state.picks[state.me]?.[p.id];
      const theirs = state.picks[other()]?.[p.id];
      const color = catColor(p.cats[0] || UNCATEGORIZED);
      const shown = p.cats.length ? p.cats : [UNCATEGORIZED];
      const badges = `<span class="cats">${shown.slice(0, 3).map(c => `<span class="cat">${esc(c)}</span>`).join("")}${shown.length > 3 ? `<span class="cat">+${shown.length - 3}</span>` : ""}</span>`;
      const map = `https://www.google.com/maps/search/${encodeURIComponent((p.zh || p.name) + " 上海")}`;
      const ph = photos[p.id];
      const thumb = ph
        ? `<div class="thumb has-photo" style="background-image:url(&quot;${esc(ph.url)}&quot;)">${badges}</div>`
        : `<div class="thumb" style="background:${color}"><span>${p.e}</span>${badges}</div>`;
      return `
  <article class="card">
    ${thumb}
    <div class="body">
      <div class="name">${esc(p.name)}<span class="zh">${esc(p.zh)}</span></div>
      <div class="meta"><span>📍 ${esc(p.area)}</span><span>⏱ ${esc(p.time)}</span><a href="${map}" target="_blank" rel="noopener">지도</a>
        <button class="linkbtn" data-edit="${esc(p.id)}">✏️ 수정</button></div>
      <div class="desc">${esc(p.desc)}</div>
      <div class="choices">
        ${CHOICES.map(c => `<button class="choice ${mine === c.v ? "on" : ""}" data-place="${p.id}" data-v="${c.v}">${c.label}</button>`).join("")}
      </div>
      <div class="other">${esc(other())}: <b>${theirs ? CHOICE_MAP[theirs].short : "아직 안 골랐어요"}</b></div>
      ${p.custom ? `<div class="added"><span>✍️ ${esc(p.addedBy)}님이 추가했어요</span></div>` : ""}
    </div>
  </article>`;
    }

    function renderList() {
      const places = allPlaces();
      const list = places.filter(p =>
        matchesFilter(p) &&
        (!state.onlyEmpty || !state.picks[state.me][p.id])
      );
      const done = places.filter(p => state.picks[state.me][p.id]).length;
      return `
    ${isLocal ? `<div class="banner">⚙️ Supabase 설정 전이라 로컬 모드예요. 체크가 이 기기에만 저장되고 상대방과 공유되지 않아요.</div>` : ""}
    ${!isLocal && !places.length ? `<div class="banner">후보가 하나도 없어요. ＋ 후보 추가로 넣거나, supabase-setup.sql을 실행하면 기본 후보 29곳이 들어가요.</div>` : ""}
    <div class="toolbar">
      <span class="progress">${esc(state.me)}: ${done} / ${places.length}개 골랐어요</span>
      <label><input type="checkbox" id="onlyEmpty" ${state.onlyEmpty ? "checked" : ""}/> 안 고른 것만</label>
    </div>
    ${state.selected.length ? `<div class="filter-note">${state.selected.map(esc).join(" · ")} 후보 ${list.length}곳 <button class="linkbtn" data-all="1">선택 해제</button></div>` : ""}
    <div class="grid">${list.length ? list.map(cardHTML).join("") : `<div class="empty">${state.onlyEmpty && places.length ? "모두 골랐어요 🎉" : "고른 카테고리에 후보가 없어요"}</div>`}</div>`;
    }

    function groupResults() {
      const [a, b] = CONFIG.PEOPLE;
      const g = {both: [], strong: [], split: [], okok: [], half: [], nope: []};
      allPlaces().forEach(p => {
        const x = state.picks[a][p.id], y = state.picks[b][p.id];
        if (!x && !y) return;
        const set = [x, y].sort().join("+");
        if (x === "must" && y === "must") g.both.push(p);
        else if (set === "must+ok") g.strong.push(p);
        else if (set === "must+pass") g.split.push(p);
        else if (x === "ok" && y === "ok") g.okok.push(p);
        else if (x === "pass" && y === "pass") g.nope.push(p);
        else if (!x || !y) g.half.push(p);
        else g.split.push(p);   // ok+pass
      });
      return g;
    }

    const GROUPS = [
      {k: "both", title: "💖💖 둘 다 꼭 가고 싶어요", hint: "일정에 바로 넣어도 되는 확정 후보예요."},
      {k: "strong", title: "💖🙂 한 명은 꼭, 한 명은 괜찮아요", hint: "시간 되면 넣기 좋은 유력 후보예요."},
      {k: "okok", title: "🙂🙂 둘 다 괜찮아요", hint: "동선이 맞으면 들르기 좋아요."},
      {k: "split", title: "🤔 의견이 갈려요", hint: "이야기해 보고 정해요."},
      {k: "half", title: "⏳ 한 명만 골랐어요", hint: "아직 안 고른 사람이 골라 주세요."},
      {k: "nope", title: "🙅🙅 둘 다 패스", hint: ""},
    ];

    function renderResult() {
      const [a, b] = CONFIG.PEOPLE;
      const g = groupResults();
      const row = p => {
        const x = state.picks[a][p.id], y = state.picks[b][p.id];
        const ph = photos[p.id];
        const icon = ph ? `<span class="ph" style="background-image:url(&quot;${esc(ph.url)}&quot;)"></span>` : `<span class="e">${p.e}</span>`;
        return `<div class="row">${icon}
      <span class="t">${esc(p.name)}<small>${esc(p.cats.join(", ") || UNCATEGORIZED)} · ${esc(p.area)} · ${esc(p.time)}</small></span>
      <span class="who">${esc(a)} ${x ? CHOICE_MAP[x].short : "-"}<br/>${esc(b)} ${y ? CHOICE_MAP[y].short : "-"}</span></div>`;
      };
      const ids = new Set(allPlaces().map(p => p.id));
      const da = Object.keys(state.picks[a]).filter(k => ids.has(k)).length;
      const db = Object.keys(state.picks[b]).filter(k => ids.has(k)).length;
      return `
    <div class="toolbar"><span class="progress">${esc(a)} ${da}개 · ${esc(b)} ${db}개 골랐어요</span></div>
    ${GROUPS.map(s => `
      <section class="section">
        <h2>${s.title} <span class="n">${g[s.k].length}곳</span></h2>
        ${s.hint ? `<p class="hint">${s.hint}</p>` : ""}
        <div class="rows">${g[s.k].length ? g[s.k].map(row).join("") : `<div class="empty">아직 없어요</div>`}</div>
      </section>`).join("")}
    <button class="btn" id="copyBtn">📋 결과 텍스트로 복사하기</button>`;
    }

    function resultText() {
      const g = groupResults();
      const lines = ["[상하이 여행 후보 결과]"];
      GROUPS.forEach(s => {
        if (!g[s.k].length || s.k === "nope") return;
        lines.push("", s.title);
        g[s.k].forEach(p => lines.push(`- ${p.name} (${p.area}, ${p.time})`));
      });
      return lines.join("\n");
    }

    function renderLoading() {
      const card = `<div class="sk-card"><div class="sk sk-thumb"></div><div class="sk-body">
    <div class="sk" style="height:18px;width:55%"></div><div class="sk" style="height:12px;width:40%"></div>
    <div class="sk" style="height:12px;width:90%"></div><div class="sk" style="height:34px"></div></div></div>`;
      return `<div class="loading-msg"><span class="spinner"></span>상하이 후보를 불러오는 중이에요…</div>
    <div class="grid">${card.repeat(4)}</div>`;
    }

    function renderError() {
      const e = loadError;
      return `<div class="errbox">
    <h2>⚠️ ${esc(e.title)}</h2>
    ${e.detail ? `<p>${esc(e.detail)}</p>` : ""}
    <ol>${e.hints.map(x => `<li>${x}</li>`).join("")}</ol>
    <button class="btn" id="retryBtn">🔄 다시 시도</button>
  </div>`;
    }

    function render() {
      const main = document.getElementById("main");
      if (state.me) document.getElementById("meName").textContent = state.me;
      renderTabs();
      if (state.loading) {main.innerHTML = renderLoading(); return;}
      if (loadError) {main.innerHTML = renderError(); return;}
      if (!state.me) return;
      main.innerHTML = state.view === "result" ? renderResult() : renderList();
      if (document.getElementById("catModal").classList.contains("show")) renderCatMgr();
    }

    function askWho() {
      document.getElementById("whoBtns").innerHTML =
        CONFIG.PEOPLE.map(p => `<button class="btn" data-who="${esc(p)}">${esc(p)}</button>`).join("");
      document.getElementById("whoModal").classList.add("show");
    }

    /* ---------- events ---------- */
    // 폼 상태: editingId가 있으면 수정 모드, 없으면 추가 모드
    let editingId = null;
    let removePhotoFlag = false;
    let formCats = [];          // 폼에서 고른 카테고리
    let formExtraCats = [];     // 폼에서 새로 입력한(아직 저장 전) 카테고리

    function renderCatPicker() {
      const names = [...allCategories(), ...formExtraCats.filter(n => !allCategories().includes(n))];
      formCats.forEach(n => {if (!names.includes(n)) names.push(n);});
      document.getElementById("catPicker").innerHTML = names.length
        ? names.map(n => `<button type="button" class="fcat ${formCats.includes(n) ? "on" : ""}" data-fcat="${esc(n)}">${esc(n)}</button>`).join("")
        : `<span class="opt" style="font-weight:400;color:var(--sub)">아래에 새 카테고리를 입력해 주세요</span>`;
    }
    function addFormCat() {
      const input = document.getElementById("catNewInput");
      const n = normCat(input.value);
      input.value = "";
      if (!n) return;
      if (n === UNCATEGORIZED) {toast(`'${UNCATEGORIZED}'는 쓸 수 없는 이름이에요`); return;}
      if (!formCats.includes(n)) formCats.push(n);
      if (!allCategories().includes(n) && !formExtraCats.includes(n)) formExtraCats.push(n);
      renderCatPicker();
    }
    document.getElementById("catNewInput").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.isComposing) {e.preventDefault(); addFormCat();}
    });

    function showPreview(url) {
      const pv = document.getElementById("addPreview");
      pv.style.backgroundImage = url ? `url("${url}")` : "";
      pv.textContent = url ? "" : "📷";
    }
    function clearObjectUrl() {
      const pv = document.getElementById("addPreview");
      if (pv.dataset.url) URL.revokeObjectURL(pv.dataset.url);
      pv.dataset.url = "";
    }

    function openForm(id) {
      const form = document.getElementById("addForm");
      form.reset(); clearObjectUrl();
      editingId = id || null;
      removePhotoFlag = false;

      const row = editingId ? findRow(editingId) : null;
      formExtraCats = [];
      formCats = row ? [...placeCats(row)] : state.selected.filter(n => n !== UNCATEGORIZED);  // 보고 있던 카테고리를 기본값으로
      renderCatPicker();
      if (row) {
        form.name.value = row.name || "";
        form.zh.value = row.zh || "";
        form.area.value = row.area || "";
        form.duration.value = row.duration || "";
        form.description.value = row.description || "";
        form.emoji.value = row.emoji || "";
      }

      const ph = editingId ? photos[editingId] : null;
      showPreview(ph?.url || "");
      document.getElementById("photoRemove").hidden = !ph;
      document.getElementById("formTitle").textContent = row ? "후보 수정 ✏️" : "새 후보 추가 ✍️";
      document.getElementById("formDesc").textContent = row
        ? "바꾼 내용은 두 사람 모두에게 바로 반영돼요."
        : "추가한 후보는 두 사람 모두에게 보여요.";
      document.getElementById("addSubmit").textContent = row ? "저장하기" : "추가하기";
      document.getElementById("formDelete").hidden = !row;

      document.getElementById("addModal").classList.add("show");
      if (!row) setTimeout(() => form.name.focus(), 50);
    }

    function closeForm() {
      document.getElementById("addForm").reset();
      clearObjectUrl(); showPreview("");
      editingId = null; removePhotoFlag = false; formCats = []; formExtraCats = [];
      document.getElementById("addModal").classList.remove("show");
    }

    document.getElementById("addPhoto").addEventListener("change", e => {
      clearObjectUrl();
      const f = e.target.files[0];
      if (f) {
        const pv = document.getElementById("addPreview");
        pv.dataset.url = URL.createObjectURL(f);
        showPreview(pv.dataset.url);
        removePhotoFlag = false;
      } else {
        showPreview(!removePhotoFlag && editingId ? photos[editingId]?.url : "");
      }
    });

    document.getElementById("photoRemove").addEventListener("click", () => {
      removePhotoFlag = true;
      document.getElementById("addPhoto").value = "";
      clearObjectUrl(); showPreview("");
      document.getElementById("photoRemove").hidden = true;
    });

    document.getElementById("formDelete").addEventListener("click", async () => {
      const row = editingId && findRow(editingId);
      if (!row) return;
      if (!confirm(`'${row.name}' 후보를 삭제할까요?\n두 사람의 선택 기록과 사진도 함께 지워져요.`)) return;
      const id = editingId;
      closeForm();
      await deletePlace(id);
    });

    function renderCatMgr() {
      const counts = {};
      placeRows.forEach(r => placeCats(r).forEach(n => counts[n] = (counts[n] || 0) + 1));
      const cats = allCategories();
      document.getElementById("catMgrList").innerHTML = cats.length
        ? cats.map(n => `<div class="row"><span class="t">${esc(n)}<small>후보 ${counts[n] || 0}곳</small></span>
        <button class="del" data-delcat="${esc(n)}">삭제</button></div>`).join("")
        : `<div class="empty">카테고리가 없어요</div>`;
    }
    function openCatMgr() {
      document.getElementById("catMgrInput").value = "";
      renderCatMgr();
      document.getElementById("catModal").classList.add("show");
    }
    async function addMgrCat() {
      const input = document.getElementById("catMgrInput");
      const n = normCat(input.value);
      if (!n) return;
      if (n === UNCATEGORIZED) {toast(`'${UNCATEGORIZED}'는 쓸 수 없는 이름이에요`); return;}
      if (allCategories().includes(n)) {toast("이미 있는 카테고리예요"); return;}
      input.value = "";
      if (await ensureCategories([n])) {render(); renderCatMgr(); toast(`'${n}' 카테고리를 만들었어요`);}
    }
    document.getElementById("catMgrInput").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.isComposing) {e.preventDefault(); addMgrCat();}
    });

    document.getElementById("addForm").addEventListener("submit", async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const v = k => (f.get(k) || "").toString().trim();
      if (!v("name")) return;
      if (normCat(document.getElementById("catNewInput").value)) addFormCat();   // 입력만 하고 추가를 안 눌렀어도 반영
      if (!formCats.length) {toast("카테고리를 1개 이상 골라 주세요"); return;}
      const fields = {
        categories: [...formCats], name: v("name"), zh: v("zh") || null,
        area: v("area") || null, duration: v("duration") || null,
        description: v("description") || null, emoji: v("emoji") || null,
      };
      const file = document.getElementById("addPhoto").files[0];
      const btn = document.getElementById("addSubmit");
      btn.disabled = true;

      let id = editingId, ok;
      const wantRemovePhoto = removePhotoFlag;
      if (!(await ensureCategories(fields.categories))) {btn.disabled = false; return;}
      if (id) {
        ok = await updatePlace(id, {...fields, updated_at: new Date().toISOString()});
      } else {
        id = newId();
        ok = await createPlace({id, ...fields, added_by: state.me, created_at: new Date().toISOString()});
      }
      btn.disabled = false;
      if (!ok) return;

      const isEdit = !!editingId;
      closeForm();
      state.view = "list"; state.onlyEmpty = false;
      if (state.selected.length && !fields.categories.some(c => state.selected.includes(c))) state.selected = [];
      render();
      toast(isEdit ? `'${fields.name}' 수정했어요` : `'${fields.name}' 추가했어요`);
      if (file) await setPhoto(id, file);
      else if (wantRemovePhoto) await removePhoto(id);
    });

    document.addEventListener("click", async e => {
      const t = e.target.closest("[data-all],[data-cat],[data-manage],[data-view],[data-fcat],[data-delcat],[data-place],[data-who],[data-edit],#meChip,#copyBtn,#addOpen,#addCancel,#retryBtn,#catNewAdd,#catMgrAdd,#catMgrClose");
      if (!t) {
        if (e.target.id === "addModal") closeForm();        // 바깥 클릭 시 닫기
        if (e.target.id === "catModal") e.target.classList.remove("show");
        return;
      }
      if (t.dataset.fcat !== undefined) {
        const n = t.dataset.fcat;
        formCats = formCats.includes(n) ? formCats.filter(x => x !== n) : [...formCats, n];
        renderCatPicker(); return;
      }
      if (t.id === "catNewAdd") {addFormCat(); return;}
      if (t.id === "catMgrAdd") {addMgrCat(); return;}
      if (t.id === "catMgrClose") {document.getElementById("catModal").classList.remove("show"); return;}
      if (t.dataset.delcat !== undefined) {
        const n = t.dataset.delcat;
        const cnt = placeRows.filter(r => placeCats(r).includes(n)).length;
        if (confirm(`'${n}' 카테고리를 삭제할까요?` + (cnt ? `\n후보 ${cnt}곳에서 이 카테고리가 빠져요. (후보는 그대로 남아요)` : ""))) {
          if (await deleteCategory(n)) {renderCatMgr(); toast(`'${n}' 카테고리를 삭제했어요`);}
        }
        return;
      }
      if (t.dataset.manage) {if (loadError) return; openCatMgr(); return;}
      if (t.dataset.all) {state.selected = []; state.view = "list"; render(); window.scrollTo({top: 0}); return;}
      if (t.dataset.cat !== undefined) {
        const n = t.dataset.cat;
        if (state.view !== "list") {state.view = "list"; state.selected = [n];}
        else state.selected = state.selected.includes(n) ? state.selected.filter(x => x !== n) : [...state.selected, n];
        render(); window.scrollTo({top: 0}); return;
      }
      if (t.dataset.view) {state.view = t.dataset.view; render(); window.scrollTo({top: 0}); return;}
      if (t.id === "retryBtn") {await loadAll(); return;}
      if (loadError && t.id === "addOpen") {toast("서버에 연결된 뒤에 추가할 수 있어요"); return;}
      if (t.id === "addOpen") openForm();
      else if (t.id === "addCancel") closeForm();
      else if (t.dataset.edit) openForm(t.dataset.edit);
      else if (t.dataset.place) setPick(t.dataset.place, t.dataset.v);
      else if (t.dataset.who) {
        state.me = t.dataset.who; safeSet(LS_ME, state.me);
        document.getElementById("whoModal").classList.remove("show");
        render();
      }
      else if (t.id === "meChip") askWho();
      else if (t.id === "copyBtn") {
        try {await navigator.clipboard.writeText(resultText()); toast("복사했어요! 카톡에 붙여넣어 보세요");}
        catch {prompt("아래 내용을 복사하세요", resultText());}
      }
    });
    document.addEventListener("change", e => {
      if (e.target.id === "onlyEmpty") {state.onlyEmpty = e.target.checked; render();}
    });

    /* ---------- start ---------- */
    (async function init() {
      const saved = safeGet(LS_ME);
      if (saved && CONFIG.PEOPLE.includes(saved)) state.me = saved;
      else askWho();                     // 이름 고르는 동안 뒤에서 불러와요
      await loadAll();
      render();
    })();
  </script>
</body>

</html>
